<!DOCTYPE html>
<!--
  COQUILLE DE LA BOUTIQUE SERVIE PAR GITHUB — ecrite par construire.mjs sous
  index.html, vendeur/, admin/ et test/, avec le chemin vers la racine.
  La page affichee depend du chemin et des parametres : voir chargeur.js.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boutique GDB</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: Georgia, serif; color: #0b1a6b; background: #fff; }
  .chargeur { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; box-sizing: border-box; text-align: center; }
  .chargeur a { color: #0b1a6b; }
  iframe.page { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  /* Version d'essai : ruban permanent, la boutique est décalée en dessous. */
  .poc-ruban { display: none; }
  body.poc .poc-ruban { display: block; position: fixed; z-index: 2147483647; top: 0; left: 0; right: 0; height: 28px; line-height: 28px; padding: 0 12px; background: #b3261e; color: #fff; font: bold 13px Georgia, serif; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.poc .poc-ruban a { color: #ffe9a8; }
  body.poc iframe.page { top: 28px; height: calc(100% - 28px); }
</style>
</head>
<body class="poc">
<div class="poc-ruban" role="note">VERSION D'ESSAI (proof of concept) — la boutique officielle est sur <a href="https://boutique.fsggb.fr/">boutique.fsggb.fr</a></div>
<div class="chargeur" id="chargeur">Chargement de la boutique…</div>
<script src="chargeur.js?v=af296e2c33" onerror="document.getElementById('chargeur').textContent = 'La boutique n\x27a pas pu être chargée (réseau). Réessayez dans un instant.'"></script>
</body>
</html>
