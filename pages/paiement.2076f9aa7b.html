  #articles-container.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 18px;
    justify-content: stretch;
  }

  .article.product-card {
    width: auto;
    height: auto;
    min-height: 0;
    overflow: hidden;
    border: 1px solid var(--shop-line);
    border-top: 3px solid var(--shop-gold);
    border-radius: 8px;
    background: var(--shop-white);
    box-shadow: 0 10px 26px rgba(0, 7, 97, 0.09);
    opacity: 1;
    transform: none;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    /* Entrée en cascade à chaque changement de rayon ou de filtre (--i posé en JS, afficherArticles). */
    animation: shopCardIn 0.4s ease both;
    animation-delay: calc(min(var(--i, 0), 16) * 30ms);
  }

  @keyframes shopCardIn {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to { opacity: 1; transform: none; }
  }

  /* "Glissement de rayon" : effet appliqué au conteneur entier au changement
     de rayon (selectionnerRayon), en plus de l'entrée en cascade des fiches. */
  #articles-container.rayon-transition {
    animation: shopAisleChange 0.42s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes shopAisleChange {
    0% { opacity: 0.3; transform: translateX(-3%); filter: blur(2px); }
    100% { opacity: 1; transform: translateX(0); filter: blur(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    #articles-container.rayon-transition {
      animation: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .article.product-card {
      animation: none;
    }
  }

  .article.product-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 34px rgba(0, 7, 97, 0.14);
  }

  .product-card-image {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--shop-soft);
    overflow: hidden;
  }

  .product-card-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 2;
    max-width: calc(100% - 20px);
    padding: 5px 10px;
    background: var(--shop-gold);
    color: var(--shop-blue);
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.02em;
    border-radius: 999px;
    box-shadow: 0 4px 10px rgba(0, 7, 97, 0.18);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .product-detail-badge {
    top: 14px;
    left: 14px;
    font-size: 13px;
    padding: 6px 14px;
  }

  .article.product-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.25s ease;
  }

  .article.product-card:hover img {
    transform: scale(1.04);
    filter: none;
  }

  .product-card-content {
    display: grid;
    gap: 8px;
    padding: 14px;
  }

  .product-card h2 {
    margin: 0;
    color: var(--shop-blue);
    font-size: 18px;
    line-height: 1.25;
  }

  .product-card-meta {
    margin: 0;
    color: var(--shop-muted);
    font-size: 13px;
  }

  .product-card-price {
    margin: 0;
    color: var(--shop-blue);
    font-weight: bold;
  }

  .product-card-button {
    width: 100%;
    min-height: 38px;
    margin-top: 4px;
    color: var(--shop-white);
    background: var(--shop-blue);
    border: 1px solid var(--shop-blue);
    border-radius: 7px;
    font-weight: bold;
  }

  .checkout-panel,
  .loader-panel,
  .message-panel {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10000;
    background: rgba(0, 0, 0, 0.52);
  }

  .checkout-panel.is-open,
  .loader-panel.is-open,
  .message-panel.is-open {
    display: flex;
  }

  /* Fiche produit : fenêtre plein écran (famille .shop-full-window), pas une
     modale flottante sur fond assombri — même traitement que le panier,
     "Mon compte" et le tunnel de commande. */
  .shop-full-window-card.product-dialog {
    position: relative;
    display: grid;
    grid-template-columns: minmax(260px, 1fr) minmax(300px, 0.95fr);
    gap: 22px;
    max-height: none;
    overflow: visible;
    padding: clamp(18px, 3vw, 32px);
  }

  /* La fiche produit n'a plus qu'UN seul controle de navigation : la fleche
     de retour (le bouton fermer faisait double emploi).
     Elle occupe sa propre rangee de la grille du dialogue plutot que d'etre
     en position:absolute. Raison : en absolute, la regle `all: unset` situee
     PLUS BAS dans ce fichier remettait `position` a `static` a specificite
     egale, et le bouton redevenait alors un ELEMENT DE GRILLE qui volait la
     premiere cellule — l'image basculait en colonne 2 et le texte passait a
     la ligne suivante. En lui donnant explicitement sa rangee, la mise en
     page ne depend plus de l'ordre des regles. */
  .product-dialog .shop-back-arrow {
    grid-column: 1 / -1;
    justify-self: start;
    margin-bottom: 2px;
  }

  .product-gallery {
    position: relative;
    display: grid;
    gap: 12px;
  }

  #product-main-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    /* "contain" et non "cover" : une image non carrée (la plupart des photos
       produit) ne doit jamais être rognée sur les côtés, juste centrée. Fond
       BLANC (pas gris/bleuté) : la plupart des visuels boutique ont déjà un
       fond blanc/clair, un fond de couleur créerait un cadre visible autour
       qui donne l'impression d'un rendu cassé plutôt que d'un vrai fond. */
    object-fit: contain;
    border-radius: 8px;
    background: var(--shop-white);
  }

  /* Les vignettes passent a la ligne plutot que de se compresser : en flex
     sans flex-shrink:0, chaque bouton retrecissait en largeur (vignettes
     hautes et etroites) des qu'il y avait beaucoup de variantes. */
  .product-thumbnails {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .product-thumbnail {
    flex: 0 0 64px;
    width: 64px;
    height: 64px;
    min-height: 64px;
    padding: 0;
    border: 2px solid var(--shop-line);
    border-radius: 7px;
    background: var(--shop-white);
    overflow: hidden;
  }

  .product-thumbnail.is-active {
    border-color: var(--shop-blue);
  }

  .product-thumbnail img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: var(--shop-white);
  }

  /* Chargement progressif des images : une version tres basse resolution
     s'affiche immediatement (floutee), puis la version definitive la
     remplace en douceur une fois telechargee — jamais d'ecran vide, et le
     volume transfere au premier affichage reste minimal. */
  .img-progressive {
    filter: blur(9px);
    transition: filter 0.35s ease;
  }

  .img-progressive.is-loaded {
    filter: blur(0);
  }

  .product-info {
    display: grid;
    align-content: start;
    gap: 14px;
    padding-right: 42px;
  }

  .product-info h2 {
    margin: 0;
    color: var(--shop-blue);
    font-size: 28px;
    text-align: left;
  }

  .product-price {
    margin: 0;
    color: var(--shop-blue);
    font-size: 22px;
    font-weight: bold;
  }

  .product-rating {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: -6px 0 4px;
  }

  .product-rating-stars,
  .product-review-stars {
    color: var(--shop-gold);
    font-size: 14px;
    letter-spacing: 1px;
  }

  .product-rating-count {
    color: var(--shop-muted);
    font-size: 12px;
  }

  .product-reviews {
    margin-top: 10px;
    padding-top: 14px;
    border-top: 1px solid var(--shop-line);
  }

  .product-reviews h3 {
    margin: 0 0 8px;
    color: var(--shop-blue);
    font-size: 14px;
  }

  .product-review-item {
    padding: 8px 0;
    border-bottom: 1px solid var(--shop-line);
  }

  .product-review-item:last-child {
    border-bottom: none;
  }

  /* Auteur de l'avis : lisible mais discret, les etoiles et le texte restent
     l'information principale. Couleur deja utilisee pour les mentions
     secondaires, aucune teinte nouvelle. */
  .product-review-author {
    display: block;
    margin-top: 3px;
    color: var(--shop-muted);
    font-size: 12px;
    word-break: break-word;
  }

  .product-review-item p {
    margin: 4px 0 0;
    color: var(--shop-ink);
    font-size: 13px;
    line-height: 1.4;
  }

  .product-stock {
    margin: 0;
    color: var(--shop-muted);
  }

  .product-field {
    display: grid;
    gap: 6px;
    color: var(--shop-blue);
    font-weight: bold;
  }

  .product-option-select {
    width: 100%;
    min-height: 48px;
    padding: 11px 44px 11px 14px;
    color: var(--shop-blue);
    background-color: var(--shop-white);
    background-image: linear-gradient(45deg, transparent 50%, var(--shop-blue) 50%), linear-gradient(135deg, var(--shop-blue) 50%, transparent 50%), linear-gradient(to right, var(--shop-soft), var(--shop-soft));
    background-position: calc(100% - 18px) calc(50% - 2px), calc(100% - 12px) calc(50% - 2px), calc(100% - 34px) 50%;
    background-size: 6px 6px, 6px 6px, 1px 60%;
    background-repeat: no-repeat;
    border: 1px solid var(--shop-line);
    border-radius: 12px;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.08);
    font-family: Georgia, serif;
    font-size: 15px;
    font-weight: 700;
    appearance: none;
    -webkit-appearance: none;
    outline: none;
  }

  .product-option-select:hover {
    border-color: var(--shop-blue);
    box-shadow: 0 14px 30px rgba(0, 7, 97, 0.12);
  }

  .product-option-select:focus {
    border-color: var(--shop-blue);
    box-shadow: 0 0 0 3px rgba(0, 7, 97, 0.12), 0 14px 30px rgba(0, 7, 97, 0.12);
  }

  .product-option-select option {
    color: var(--shop-blue);
    background: var(--shop-white);
  }

  /* L'action principale prend la place disponible, "Favori" seulement ce
     qu'il lui faut : en deux colonnes egales, "Ajouter au panier" passait
     sur deux lignes. */
  .product-actions {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px;
  }

  .product-actions button {
    padding: 0 14px;
    white-space: nowrap;
  }

  .product-actions .secondary-action {
    color: var(--shop-blue);
    background: var(--shop-sand);
    border-color: var(--shop-gold);
  }



  .cart-drawer,
  .account-panel {
    touch-action: pan-y;
    overscroll-behavior-y: contain;
  }

  @media (min-width: 900px) {
    .shop-overlay.is-visible {
      background: transparent;
      backdrop-filter: none;
      pointer-events: none;
    }

    .shop-body.cart-open .shop-layout,
    .shop-body.cart-open .shop-footer {
      margin-right: min(420px, 32vw);
      transition: margin-right 0.22s ease;
    }
  }

  /* L'ancien style "tiroir etroit glissant depuis la droite" (.account-panel
     en position:fixed, width:420px, transform:translateX) a ete retire :
     Mon compte est desormais rendu comme "Mon panier", dans un
     .shop-full-window plein ecran (regles plus bas, partagees avec
     #cart-page/#checkout-window/#product-modal) — plus de 2e systeme de
     conteneur en parallele. */

  /* Onglets du panneau Mon compte */
  /* Meme traitement "pilule" que .seller-tab/.department-tab, pas un
     soulignement Material Design : coherence visuelle avec le reste de
     l'interface, pas un 3e style de navigation different. */
  .account-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    overflow-x: auto;
    margin-bottom: 16px;
    position: sticky;
    top: 0;
    background: var(--shop-white);
    z-index: 3;
    padding: 10px 2px;
  }

  .account-tab {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    padding: 0 16px;
    color: var(--shop-muted);
    background: var(--shop-white);
    border: 2px solid var(--shop-line);
    border-radius: 999px;
    font-family: inherit;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s ease;
    white-space: nowrap;
  }

  .account-tab:hover {
    color: var(--shop-blue);
    background: var(--shop-sand);
    border-color: var(--shop-gold);
    transform: translateY(-1px);
  }

  .account-tab.is-active {
    color: var(--shop-blue);
    background: var(--shop-sand);
    border-color: var(--shop-gold);
    box-shadow: 0 4px 12px rgba(200, 162, 74, 0.25);
    transform: translateY(-1px);
  }

  .account-tab-panel {
    display: none;
  }

  .account-tab-panel.is-active {
    display: block;
  }

  /* Filtres auto dans l'onglet Mes infos */
  .account-auto-filters {
    background: #f7f8ff;
    border: 1px solid var(--shop-line);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
  }

  .account-auto-filters-title {
    font-size: 13px;
    font-weight: bold;
    color: var(--shop-blue);
    margin: 0 0 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .account-auto-filters-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }

  .account-filter-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--shop-sand);
    color: var(--shop-blue);
    font-size: 12px;
    font-weight: 600;
  }

  .account-filter-tag i {
    font-size: 10px;
    color: var(--shop-gold);
  }

  .account-auto-filters-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--shop-muted);
    cursor: pointer;
    padding-top: 8px;
    border-top: 1px solid var(--shop-line);
  }

  .account-auto-filters-toggle input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--shop-blue);
    cursor: pointer;
  }

  .shop-drawer-tabs {
    position: sticky;
    top: 18px;
    z-index: 2;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 8px;
    margin-bottom: 16px;
    border: 1px solid var(--shop-line);
    border-radius: 18px;
    background: linear-gradient(180deg, #ffffff 0%, #f7f8ff 100%);
    box-shadow: 0 10px 24px rgba(0, 7, 97, 0.08);
  }

  .shop-drawer-tab {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 46px;
    padding: 0 14px;
    border: 1px solid transparent;
    border-radius: 12px;
    background: transparent;
    color: var(--shop-muted);
    font-weight: 800;
    letter-spacing: 0.01em;
    text-transform: none;
    box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.8);
    transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }

  .shop-drawer-tab:hover {
    transform: translateY(-1px);
    color: var(--shop-blue);
  }

  .shop-drawer-tab.is-active {
    color: var(--shop-blue);
    background: var(--shop-white);
    border-color: var(--shop-gold);
    box-shadow: 0 6px 14px rgba(200, 162, 74, 0.18), inset 0 -2px 0 rgba(0, 7, 97, 0.04);
    transform: translateY(-1px);
  }

  .shop-drawer-tab i {
    font-size: 0.95em;
  }

  .account-list {
    display: grid;
    gap: 10px;
  }

  .account-list-item {
    display: grid;
    gap: 4px;
    padding: 12px;
    border: 1px solid var(--shop-line);
    border-radius: 7px;
    background: var(--shop-white);
  }

  /* ---- Mon compte : sections (auparavant tout en styles en ligne, donc
     impossible a harmoniser d'un onglet a l'autre) ---- */
  .account-section {
    display: grid;
    gap: 16px;
  }

  .account-hint {
    margin: 0;
    color: var(--shop-muted);
    font-size: 14px;
    line-height: 1.5;
  }

  /* Remplace la fenetre "Connexion requise" qui s'empilait sur cette page. */
  .account-login-notice {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin: 0 0 16px;
    padding: 12px 14px;
    color: var(--shop-blue);
    background: var(--theme-warning-bg);
    border: 1px solid var(--shop-gold);
    border-radius: var(--radius-field);
    font-weight: bold;
  }

  .account-login-notice i {
    margin-top: 2px;
    color: var(--shop-gold);
  }

  .account-panel-body .access-form {
    margin-top: 14px;
  }

  .account-identity {
    display: grid;
    gap: 2px;
  }

  .account-identity span {
    color: var(--shop-muted);
    font-size: 13px;
  }

  .account-identity strong {
    color: var(--shop-blue);
    font-size: 16px;
    word-break: break-all;
  }

  .account-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--shop-muted);
    font-size: 13px;
    cursor: pointer;
  }

  .account-stats-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .account-stat {
    display: grid;
    gap: 2px;
    padding: 12px 14px;
    background: var(--theme-surface-alt);
    border: 1px solid var(--shop-line);
    border-radius: var(--radius-field);
  }

  .account-stat span {
    color: var(--shop-muted);
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .account-stat strong {
    color: var(--shop-blue);
    font-size: 20px;
  }

  .account-profile-box {
    display: grid;
    gap: 2px;
    padding: 12px 14px;
    color: var(--shop-blue);
    font-size: 14px;
    border: 1px solid var(--shop-line);
    border-radius: var(--radius-field);
  }

  .account-profile-box strong {
    margin-bottom: 4px;
  }

  .account-primary-button {
    justify-self: start;
    min-height: 40px;
    padding: 0 18px;
    color: var(--shop-white);
    background: var(--shop-blue);
    border: 1px solid var(--shop-blue);
    border-radius: var(--radius-field);
    font-weight: bold;
  }

  .account-primary-button:hover {
    background: var(--shop-ink);
    border-color: var(--shop-ink);
  }

  /* Deconnexion : action secondaire (contour), plus un aplat rouge fonce
     pleine largeur qui dominait tout l'onglet. */
  .account-logout-button {
    justify-self: start;
    min-height: 36px;
    padding: 0 14px;
    color: var(--theme-danger);
    background: transparent;
    border: 1px solid rgba(154, 37, 48, 0.35);
    border-radius: var(--radius-field);
    font-weight: bold;
  }

  .account-logout-button:hover {
    color: var(--shop-white);
    background: var(--theme-danger);
    border-color: var(--theme-danger);
  }

  .account-settings-grid {
    margin: 0;
  }

  .account-settings-message {
    margin: 0;
    min-height: 16px;
    color: var(--theme-success);
    font-size: 13px;
    font-weight: bold;
  }

  .account-empty {
    margin: 0;
    padding: 14px;
    color: var(--shop-muted);
    font-size: 14px;
    text-align: center;
    border: 1px dashed var(--shop-line);
    border-radius: var(--radius-field);
  }

  .account-empty.is-error {
    color: var(--theme-danger);
    border-style: solid;
    border-color: rgba(154, 37, 48, 0.3);
  }

  .account-favori {
    width: 100%;
    justify-items: start;
    text-align: left;
    font-weight: normal;
    cursor: pointer;
  }

  .account-favori strong {
    color: var(--shop-blue);
  }

  .account-favori span {
    color: var(--shop-muted);
    font-size: 12px;
  }

  .account-favori:hover {
    background: var(--theme-surface-alt);
    border-color: var(--shop-gold);
  }

  /* ---- Historique : groupes par destinataire ---- */
  .account-history {
    display: grid;
    gap: 14px;
  }

  .account-history-group {
    border: 1px solid var(--shop-line);
    border-radius: var(--radius-field);
    overflow: hidden;
  }

  .account-history-group-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 6px 12px;
    padding: 10px 14px;
    background: var(--theme-surface-alt);
    border-bottom: 1px solid var(--shop-line);
  }

  .account-history-dest {
    color: var(--shop-blue);
    font-size: 14px;
    font-weight: bold;
  }

  .account-history-sum {
    color: var(--shop-muted);
    font-size: 12px;
  }

  .account-history-group-body {
    display: grid;
  }

  .quantity-stepper {
    display: grid;
    grid-template-columns: 42px minmax(74px, 110px) 42px;
    gap: 8px;
    align-items: center;
  }

  .quantity-stepper button {
    min-height: 42px;
    border: 1px solid var(--shop-blue);
    border-radius: 7px;
    color: var(--shop-white);
    background: var(--shop-blue);
  }

  .quantity-stepper input {
    text-align: center;
    font-weight: bold;
  }

  .cart-drawer {
    display: none;
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    height: 100%;
    z-index: 9500;
    width: min(420px, 100%);
    padding: 18px;
    padding-top: 110px;
    box-sizing: border-box;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    color: var(--shop-blue);
    background: var(--shop-white);
    box-shadow: -18px 0 44px rgba(0, 0, 0, 0.2);
    transform: translateX(100%);
    transition: transform 0.3s ease;
  }

  #panier.cart-drawer {
    left: auto;
    width: min(420px, 100%);
    height: 100%;
    text-align: left;
    color: var(--shop-blue);
    background: var(--shop-white);
    overflow-y: auto;
    padding-top: 110px;
  }

  .cart-drawer.is-open {
    display: block;
    transform: translateX(0);
  }

  #panier.cart-drawer.is-open {
    display: block;
    transform: translateX(0);
  }

  .cart-header,
  .cart-line,
  .cart-total,
  .checkout-header {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
  }

  .cart-header {
    margin-top: 2px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--shop-line);
  }

  .cart-header h2,
  .checkout-header h2 {
    margin: 0;
    color: var(--shop-blue);
    text-align: left;
  }

  .cart-actions button:disabled,
  .product-actions button:disabled,
  .checkout-pay-button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .cart-line {
    align-items: flex-start;
    padding: 14px 0;
    border-bottom: 1px solid var(--shop-line);
  }

  .cart-line-image {
    width: 64px;
    height: 64px;
    flex: 0 0 64px;
    object-fit: cover;
    border-radius: 7px;
    border: 1px solid var(--shop-line);
    background: var(--shop-sand);
  }

  .cart-line strong {
    display: block;
    margin-bottom: 4px;
  }

  .cart-line span {
    display: block;
    color: var(--shop-muted);
    font-size: 13px;
  }

  .cart-line input {
    width: 72px;
    min-height: 36px;
    margin: 8px 0 0;
    padding: 6px;
    gap: 10px;
  }

  .cart-line button,
  .cart-header button {
    color: var(--shop-blue);
    background: var(--shop-white);
    border: 1px solid var(--shop-line);
    border-radius: 7px;
  }

  .cart-total {
    padding: 16px 0;
    font-size: 18px;
    font-weight: bold;
  }

  .cart-actions {
    display: grid;
    gap: 10px;
  }

  .checkout-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin: 18px 0;
  }

  .checkout-pay-button {
    width: 100%;
    min-height: 48px;
    font-size: 17px;
  }

  .checkout-note {
    margin: 12px 0 0;
    color: var(--shop-muted);
    text-align: center;
  }

  /* ============================================
     TUNNEL DE COMMANDE — fenêtre plein écran
     (même famille visuelle que .shop-full-window,
     utilisée aussi pour le panier)
     ============================================ */

  .checkout-window-card {
    width: min(760px, 100%);
    display: flex;
    flex-direction: column;
  }

  .checkout-window-body {
    padding: 0 clamp(18px, 3vw, 32px) clamp(18px, 3vw, 32px);
    overflow-y: auto;
  }

  .checkout-window-card .checkout-note {
    padding: 0 clamp(18px, 3vw, 32px) clamp(18px, 3vw, 32px);
  }

  /* --- Timeline des étapes --- */

  .checkout-steps {
    padding: 4px clamp(18px, 3vw, 32px) 18px;
    border-bottom: 1px solid var(--shop-line);
  }

  .checkout-steps ol {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 4px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .checkout-step {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
  }

  .checkout-step::before {
    content: "";
    position: absolute;
    top: 15px;
    left: -50%;
    width: 100%;
    height: 2px;
    background: var(--shop-line);
    z-index: 0;
  }

  .checkout-step:first-child::before {
    content: none;
  }

  .checkout-step.is-complete::before {
    background: var(--shop-gold);
  }

  .checkout-step-circle {
    position: relative;
    z-index: 1;
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    color: var(--shop-muted);
    font-weight: bold;
    font-size: 13px;
    background: var(--shop-white);
    border: 2px solid var(--shop-line);
    border-radius: 50%;
    transition: all 0.2s ease;
  }

  .checkout-step-label {
    color: var(--shop-muted);
    font-size: 12px;
    font-weight: 600;
  }

  .checkout-step.is-active .checkout-step-circle {
    color: var(--shop-white);
    background: var(--shop-blue);
    border-color: var(--shop-blue);
  }

  .checkout-step.is-active .checkout-step-label {
    color: var(--shop-blue);
  }

  .checkout-step.is-complete .checkout-step-circle {
    color: var(--shop-blue);
    background: var(--shop-gold);
    border-color: var(--shop-gold);
  }

  .checkout-step-progress {
    display: none;
    margin: 10px 0 0;
    color: var(--shop-muted);
    font-size: 13px;
    font-weight: bold;
    text-align: center;
  }

  @media (max-width: 640px) {
    .checkout-step-label { display: none; }
    .checkout-step-progress { display: block; }

    .checkout-step-actions {
      flex-direction: column-reverse;
      align-items: stretch;
    }

    .checkout-step-actions .checkout-pay-button,
    .checkout-secondary-button {
      width: 100%;
      min-width: 0;
      margin-left: 0;
      justify-content: center;
    }

    .checkout-delivery-option {
      flex-wrap: wrap;
    }

    .checkout-recap-line {
      flex-wrap: wrap;
    }
  }

  /* --- Panneaux d'étape --- */

  .checkout-step-panel {
    display: none;
  }

  .checkout-step-panel.is-active {
    display: block;
    animation: checkoutStepIn 0.25s ease;
  }

  @keyframes checkoutStepIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .checkout-step-panel h3 {
    margin: 22px 0 4px;
    color: var(--shop-blue);
    font-size: 18px;
  }

  .checkout-step-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 8px;
  }

  .checkout-step-actions .checkout-pay-button {
    width: auto;
    min-width: 220px;
    margin-left: auto;
  }

  .checkout-secondary-button {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 0 16px;
    color: var(--shop-blue);
    background: var(--shop-white);
    border: 1px solid var(--shop-line);
    border-radius: 7px;
    font: bold 14px Georgia, serif;
    cursor: pointer;
  }

  .checkout-secondary-button:hover {
    background: var(--shop-sand);
    border-color: var(--shop-gold);
  }

  .checkout-step-hint {
    margin: 8px 0 0;
    padding: 8px 12px;
    color: var(--shop-blue);
    font-size: 13px;
    background: var(--shop-sand);
    border-radius: 7px;
  }

  /* --- Étape 1 : options de livraison --- */

  .checkout-delivery-options {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin: 14px 0 16px;
  }

  .checkout-delivery-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    border: 2px solid var(--shop-line);
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .checkout-delivery-option:has(input:checked) {
    border-color: var(--shop-blue);
    background: rgba(0, 7, 97, 0.04);
  }

  .checkout-delivery-option input {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  .checkout-delivery-copy {
    flex: 1;
  }

  .checkout-delivery-copy strong {
    display: block;
    color: var(--shop-blue);
  }

  .checkout-delivery-copy small {
    display: block;
    margin-top: 2px;
    color: var(--shop-muted);
    font-size: 13px;
  }

  .checkout-delivery-price {
    flex-shrink: 0;
    color: var(--shop-blue);
    font-weight: bold;
    font-size: 15px;
  }

  .checkout-delivery-price.is-gold {
    color: var(--shop-gold);
  }

  .checkout-delivery-price.is-soon {
    color: var(--shop-muted);
    font-size: 13px;
    font-weight: normal;
  }

  .checkout-delivery-option.is-disabled {
    cursor: not-allowed;
    opacity: 0.6;
  }

  /* --- Étape 2 : coordonnées --- */

  .checkout-address-fields {
    transition: opacity 0.15s ease;
  }

  .checkout-address-fields.is-hidden {
    display: none;
  }

  .checkout-mondialrelay-fields {
    margin-top: 14px;
  }

  .checkout-mondialrelay-fields.is-hidden {
    display: none;
  }

  /* Widget Mondial Relay : HTML tiers, avec ses propres styles et ses propres
     largeurs fixes. On ne le remet pas en forme (ce serait a refaire a chaque
     mise a jour de leur widget) — on l'oblige seulement a tenir dans la
     fenetre de commande, sans deborder ni pousser le reste. */
  #mr-widget-zone {
    max-height: min(420px, 55vh);
    overflow: auto;
    padding: 4px;
    border: 1px solid var(--shop-line);
    border-radius: 10px;
    background: var(--shop-white, #ffffff);
    /* Le defilement du widget ne doit pas entrainer celui de la fenetre de
       commande derriere lui une fois arrive en bout de liste. */
    overscroll-behavior: contain;
  }

  /* Le widget suppose une largeur de page entiere : sans ces regles, ses
     tableaux et ses images debordent lateralement du panneau. */
  #mr-widget-zone * {
    max-width: 100%;
    box-sizing: border-box;
  }

  #mr-widget-zone img {
    height: auto;
  }

  #mr-widget-zone table {
    width: 100% !important;
    table-layout: fixed;
  }

  /* Ses champs de recherche heritent d'une police minuscule sur mobile, ce qui
     declenche le zoom automatique de Safari a chaque saisie. */
  #mr-widget-zone input,
  #mr-widget-zone select,
  #mr-widget-zone button {
    max-width: 100%;
    font-size: 16px;
  }

  /* Point relais survole ou choisi : reprend les couleurs de la boutique pour
     que la selection soit lisible malgre le style d'origine du widget. */
  #mr-widget-zone .PR-List-Item:hover,
  #mr-widget-zone .PR-Item:hover {
    background: rgba(0, 7, 97, 0.06);
    cursor: pointer;
  }

  @media (max-width: 640px) {
    #mr-widget-zone {
      max-height: 60vh;
    }
  }

  .checkout-mr-selected {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    padding: 10px 12px;
    background: rgba(0, 7, 97, 0.05);
    border: 1px solid var(--shop-blue);
    border-radius: 8px;
    font-size: 13px;
    color: var(--shop-blue);
  }

  .checkout-mr-selected.is-hidden {
    display: none;
  }

  .checkout-mr-selected i {
    color: var(--shop-gold);
    font-size: 16px;
  }

  .checkout-mr-selected strong {
    display: block;
  }

  .checkout-mr-selected span {
    color: var(--shop-muted);
    font-size: 12px;
  }

  /* --- Étape 3 : récapitulatif --- */

  .checkout-recap {
    display: grid;
    gap: 14px;
    margin: 14px 0 16px;
  }

  .checkout-recap-section {
    padding: 14px 16px;
    background: var(--shop-sand);
    border-radius: 10px;
  }

  .checkout-recap-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }

  .checkout-recap-heading h4 {
    margin: 0;
    color: var(--shop-blue);
    font-size: 14px;
  }

  .checkout-recap-edit {
    color: var(--shop-blue);
    background: none;
    border: none;
    font: bold 12px Georgia, serif;
    text-decoration: underline;
    cursor: pointer;
  }

  .checkout-recap-section p {
    margin: 0;
    color: var(--shop-ink);
    font-size: 14px;
    line-height: 1.5;
  }

  .checkout-recap-line {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 0;
    color: var(--shop-ink);
    font-size: 14px;
  }

  .checkout-recap-line small {
    color: var(--shop-muted);
  }

  .checkout-recap-total {
    margin-top: 6px;
    padding-top: 10px;
    border-top: 2px solid var(--shop-gold);
    color: var(--shop-blue);
    font-size: 16px;
  }

  /* --- Étape 4 : paiement --- */

  .checkout-payment-zone {
    min-height: 160px;
    display: grid;
    place-items: center;
    margin: 14px 0;
  }

  .checkout-payment-loading,
  .checkout-payment-success,
  .checkout-payment-error {
    display: grid;
    justify-items: center;
    gap: 10px;
    padding: 20px;
    text-align: center;
  }

  .checkout-payment-loading .loader-spinner {
    width: 40px;
    height: 40px;
    border: 5px solid rgba(0, 7, 97, 0.15);
    border-top-color: var(--shop-blue);
    border-radius: 50%;
    animation: shop-spin 1s infinite linear;
  }

  .checkout-payment-success i {
    color: #2e7d32;
    font-size: 40px;
  }

  .checkout-payment-success h4 {
    margin: 0;
    color: var(--shop-blue);
  }

  .checkout-payment-success .alert-action-btn {
    margin-top: 8px;
  }

  .checkout-payment-error i {
    color: #9a2530;
    font-size: 32px;
  }

  .loader-panel {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 7, 97, 0.85);
    /* Au-dessus de .checkout-panel (10000) : le loader est declenche depuis le tunnel. */
    z-index: 15000;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--shop-white);
    box-sizing: border-box;
  }

  .loader-panel.is-open {
    display: flex;
  }

  .loader-spinner {
    width: 48px;
    height: 48px;
    border: 5px solid rgba(255, 255, 255, 0.25);
    border-top-color: var(--shop-sand);
    border-radius: 50%;
    animation: shop-spin 1s infinite linear;
    margin-bottom: 12px;
  }

  .shop-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.44);
    backdrop-filter: blur(2px);
    z-index: 9300;
    pointer-events: auto;
    cursor: pointer;
    touch-action: none;
  }

  .shop-overlay.is-visible {
    display: block;
  }

  @keyframes shop-spin {
    to { transform: rotate(360deg); }
  }

  .shop-footer {
    padding: 10px clamp(16px, 4vw, 56px);
    border-top: 1px solid var(--shop-line);
    background: var(--shop-blue);
    text-align: center;
  }

  .shop-footer a {
    color: var(--shop-white);
    font-weight: bold;
    text-decoration: none;
  }



  #loader.loader-panel,
  #message.message-panel {
    width: 100%;
    height: 100%;
    transform: none;
    text-align: center;
    background: rgba(0, 0, 0, 0.52);
    overflow: auto;
  }

  #loader.loader-panel.is-open,
  #message.message-panel.is-open {
    display: flex;
  }

  @media (max-width: 820px) {
    .shop-toolbar {
      position: static;
    }

    /* En-tete mobile compact. Il passait en colonne, ce qui empilait
       logo + titre, puis la recherche, puis les boutons : l'en-tete
       occupait alors presque tout l'ecran avant meme le premier produit.
       On garde une seule rangee (marque a gauche, actions a droite) et la
       recherche descend sur sa propre ligne. */
    .shop-header {
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 12px clamp(12px, 4vw, 20px);
      position: sticky;
      top: 0;
    }

    .brand-block {
      flex: 1 1 auto;
      min-width: 0;
    }

    .shop-header-actions {
      flex: 0 0 auto;
      gap: 8px;
    }

    .shop-header-search {
      order: 3;
      flex: 1 1 100%;
      min-width: 0;
    }

    .app-logo {
      width: 38px;
      height: 38px;
    }

    .shop-header h1 {
      font-size: 19px;
    }

    .shop-kicker {
      font-size: 10px;
    }

    /* Icones seules : les libelles "Mon compte" / "Mon panier" font deborder
       la rangee sur les petits ecrans. */
    .shop-header-actions .header-action-label {
      display: none;
    }

    .shop-header-actions > button {
      width: 44px;
      min-width: 44px;
      padding: 0;
      justify-content: center;
    }

    .access-panel,
    .access-form {
      grid-template-columns: 1fr;
    }

    .shop-toolbar {
      grid-template-columns: 1fr;
    }

    #articles-container.product-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .product-dialog,
    .checkout-grid {
      grid-template-columns: 1fr;
    }

    .shop-header-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
    }

    #account-open-button,
    #cart-open-button {
      width: 100%;
      min-width: 0;
    }

    .product-info {
      padding-right: 0;
    }

    .product-actions button {
      min-height: 44px;
      padding: 8px;
      font-size: 14px;
    }

    .cart-drawer {
      width: 100%;
      max-width: 100%;
      padding-top: 110px;
    }

    .shop-sidebar {
      top: 110px;
      max-height: calc(100vh - var(--shop-header-height, 95px) - 30px);
    }
  }

  @media (max-width: 520px) {
    /* 2 colonnes, pas 1 : une seule fiche par ecran obligeait a defiler
       enormement pour parcourir le catalogue — 2 colonnes est le standard
       des boutiques mobiles. Typographie reduite en proportion. */
    #articles-container.product-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .product-card h2 {
      font-size: 14px;
    }

    .product-card-meta {
      font-size: 11px;
    }

    .product-card-price {
      font-size: 14px;
    }

    .product-card-content {
      gap: 5px;
      padding: 10px;
    }

    .shop-header h1 {
      font-size: 25px;
    }

    .product-info h2 {
      font-size: 23px;
    }
  }
  /* Refonte catalogue : les rayons deviennent le point d'entrée principal. */
  .visually-hidden {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    padding: 0 !important;
    margin: -1px !important;
    overflow: hidden !important;
    clip: rect(0, 0, 0, 0) !important;
    white-space: nowrap !important;
    border: 0 !important;
  }

  .shop-body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .shop-layout {
    display: grid;
    grid-template-columns: minmax(205px, 230px) minmax(0, 1fr);
    align-items: start;
    width: min(1440px, 100%);
    flex: 1 0 auto;
    box-sizing: border-box;
    /* AUCUNE compensation de hauteur d'en-tete ici : .shop-header est en
       position:sticky (regle ci-dessus, qui l'emporte sur le position:fixed
       de CSS_Common.html charge avant). Un element sticky reste dans le flux
       et occupe donc deja sa propre hauteur — ajouter un padding-top egal a
       cette hauteur la comptait deux fois et creait un grand vide sous le
       bandeau. Seul .shop-full-window (panier, compte, fiche produit,
       paiement) passe SOUS le bandeau et a besoin de cette compensation. */
    padding: clamp(18px, 3vw, 34px) clamp(16px, 4vw, 56px) 42px;
    gap: clamp(20px, 3vw, 42px);
  }

  /* Placee comme 1er enfant de .shop-layout (pas un frere avant lui) : elle
     herite ainsi de la marge de securite deja calculee pour le bandeau fixe
     (padding-top ci-dessus) sans avoir a la recalculer elle-meme, et sans
     jamais doubler cet espacement quand elle est masquee (hidden -> aucune
     ligne de grille consommee). Chargee en parallele du catalogue (pas
     avant), jamais bloquante. */
  .account-avoir {
    margin: 10px 0 0;
    padding: 10px 12px;
    color: var(--shop-blue);
    background: var(--shop-sand);
    border-radius: 8px;
    font-size: 14px;
  }

  /* Boutique fermee par l'administrateur (BACK_Parametres.js). */
  .shop-fermee {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px 16px;
    color: #9a2530;
    background: #fff5f5;
    border-bottom: 1px solid #f0c2c7;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
  }

  .shop-announcement {
    display: flex;
    align-items: center;
    gap: 10px;
    grid-column: 1 / -1;
    padding: 12px 16px;
    margin-bottom: clamp(12px, 2vw, 20px);
    border: 1px solid var(--shop-line);
    border-left: 5px solid var(--shop-blue);
    border-radius: 8px;
    background: var(--shop-surface);
    color: var(--shop-blue);
    font-size: 14px;
  }

  .shop-announcement[hidden] {
    display: none;
  }

  .shop-announcement i:first-child {
    font-size: 16px;
    flex-shrink: 0;
  }

  #shop-announcement-text {
    flex: 1;
    min-width: 0;
  }

  .shop-announcement button {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    min-height: 30px;
    padding: 0;
    color: inherit;
    background: transparent;
    border-color: currentColor;
  }

  .shop-announcement.is-type-evenement {
    border-left-color: var(--shop-gold);
    background: var(--shop-sand);
  }

  .shop-announcement.is-type-alerte {
    border-left-color: #c53030;
    background: #fff5f5;
    color: #9a2530;
  }

  .shop-sidebar {
    width: auto;
    max-width: none;
    padding: 18px;
    border-radius: 12px;
    border-top: 4px solid var(--shop-gold);
    box-shadow: 0 12px 30px rgba(0, 7, 97, 0.08);
  }

  .shop-main-content {
    display: grid;
    align-content: start;
    gap: 18px;
  }

  .catalogue-intro {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 22px;
    padding: 4px 2px 0;
  }

  .catalogue-intro h2 {
    margin: 0;
    color: var(--shop-blue);
    font-size: clamp(24px, 3vw, 34px);
    line-height: 1.05;
  }

  .catalogue-intro > p {
    max-width: 370px;
    margin: 0;
    color: var(--shop-muted);
    font-size: 14px;
    line-height: 1.45;
    text-align: right;
  }

  .department-tabs {
    display: flex;
    gap: 9px;
    overflow-x: auto;
    padding: 8px;
    border: 1px solid var(--shop-line);
    border-radius: 12px;
    background: linear-gradient(90deg, var(--shop-white), #f7f8ff);
    box-shadow: 0 10px 26px rgba(0, 7, 97, 0.07);
    scrollbar-width: thin;
    /* Reste visible en scrollant le catalogue : on voit toujours dans quel
       rayon on se trouve, sans devoir remonter en haut de page. */
    position: sticky;
    top: 86px;
    z-index: 30;
  }

  .department-tab {
    flex: 0 0 auto;
    min-height: 42px;
    padding: 0 18px;
    border: 2px solid var(--shop-line);
    border-radius: 999px;
    color: var(--shop-muted);
    background: var(--shop-white);
    font-family: Georgia, serif;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
  }

  /* Le texte passe explicitement en bleu marine au survol : au repos il est
     en --shop-muted (gris-bleu clair), qui sur le fond sable du survol
     tombe a un contraste trop faible pour rester confortablement lisible. */
  .department-tab:hover,
  .department-tab:focus-visible {
    color: var(--shop-blue);
    border-color: var(--shop-gold);
    background: var(--shop-sand);
    outline: none;
    transform: translateY(-1px);
  }

  .department-tab.is-active {
    color: var(--shop-blue);
    background: var(--shop-sand);
    border-color: var(--shop-gold);
    box-shadow: 0 4px 12px rgba(200, 162, 74, 0.25);
    transform: translateY(-1px);
  }

  #articles-container.product-grid {
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 20px;
  }

  .article.product-card {
    border-top-width: 4px;
    border-radius: 12px;
  }

  .product-card-content {
    gap: 9px;
    padding: 16px;
  }

  .shop-footer {
    margin-top: auto;
    padding: 10px clamp(16px, 4vw, 56px);
  }

  .shop-footer a {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    min-height: 28px;
  }

  /* Grille 1fr / auto / 1fr : prix + statut EXACTEMENT centres dans la
     largeur, bordereau + chevron cales tout a droite, quel que soit le
     contenu des colonnes voisines. */
  .account-order-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    font-size: 13px;
    background: var(--shop-white);
    border-top: 1px solid var(--shop-line);
    cursor: pointer;
    transition: background 0.12s ease;
  }

  .account-history-group-body > .account-order-row:first-child {
    border-top: none;
  }

  .account-order-row:hover {
    background: var(--theme-surface-alt);
  }

  .account-order-row:focus-visible {
    outline: 2px solid var(--shop-gold);
    outline-offset: -2px;
  }

  .account-order-ref {
    display: grid;
    justify-items: start;
    gap: 2px;
    min-width: 0;
  }

  .account-order-ref strong {
    color: var(--shop-blue);
    overflow-wrap: anywhere;
  }

  .account-order-ref > span:not(.account-payment-badge) {
    color: var(--shop-muted);
    font-size: 11px;
  }

  .account-order-amount {
    display: grid;
    justify-items: center;
    gap: 2px;
    text-align: center;
  }

  .account-order-amount strong {
    color: var(--shop-blue);
    font-size: 14px;
    white-space: nowrap;
  }

  .account-order-status {
    font-size: 11px;
    font-weight: bold;
  }

  .account-order-status.is-done {
    color: var(--theme-success);
  }

  /* Une commande en cours n'est pas une erreur : ambre, pas rouge. */
  .account-order-status.is-todo {
    color: #9a5b00;
  }

  .account-order-status.is-cancelled {
    color: var(--shop-muted);
  }

  .account-order-end {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
  }

  .order-document-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-height: 32px;
    padding: 0 9px;
    color: var(--shop-blue);
    background: var(--shop-sand);
    border: 1px solid var(--shop-gold);
    border-radius: 6px;
    font-size: 12px;
    font-weight: bold;
    text-decoration: none;
  }

  .order-document-link:hover,
  .order-document-link:focus-visible {
    color: var(--shop-white);
    background: var(--shop-blue);
    border-color: var(--shop-blue);
    outline: none;
  }

  .account-payment-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 4px;
    padding: 2px 8px;
    font-size: 10px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: .02em;
    border-radius: 999px;
  }

  .account-payment-badge.is-paid { color: #2e7d32; background: #e8f5e9; }
  .account-payment-badge.is-pending { color: #e65100; background: #fff3e0; }
  .account-payment-badge.is-expired { color: #9a2530; background: #fdecea; }
  .account-payment-badge.is-legacy { color: var(--shop-muted); background: var(--shop-sand); }

  .account-order-chevron {
    color: var(--shop-muted);
    font-size: 12px;
    transition: transform 0.2s ease;
  }

  .account-order-row[aria-expanded="true"] .account-order-chevron {
    transform: rotate(180deg);
  }

  .account-order-lines {
    display: grid;
    gap: 8px;
    padding: 10px 14px 12px;
    background: var(--theme-surface-alt);
    border-top: 1px dashed var(--shop-line);
  }

  .account-order-lines-loading {
    padding: 6px 0;
    color: var(--shop-muted);
    font-size: 12px;
  }

  .account-order-line {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* Cadre de vignette : icone de repli dessous, image par-dessus (retiree
     si elle ne charge pas). */
  .account-order-line-thumb {
    position: relative;
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    overflow: hidden;
    color: var(--shop-soft);
    background: var(--shop-white);
    border: 1px solid var(--shop-line);
    border-radius: 6px;
  }

  .account-order-line-thumb img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: var(--shop-white);
  }

  .account-order-line.is-retired .account-order-line-info strong {
    color: var(--shop-muted);
  }

  .account-order-line-info {
    flex: 1;
    min-width: 0;
  }

  .account-order-line-info strong {
    display: block;
    color: var(--shop-blue);
    font-size: 13px;
  }

  .account-order-line-info span,
  .account-order-line-info small {
    display: block;
    color: var(--shop-muted);
    font-size: 11px;
  }

  .account-order-line-total {
    flex-shrink: 0;
    color: var(--shop-blue);
    font-size: 13px;
  }

  .account-order-reorder-button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    justify-self: end;
    min-height: 36px;
    padding: 0 14px;
    margin-top: 4px;
    color: var(--shop-white);
    background: var(--shop-blue);
    border: none;
    border-radius: 7px;
    font: bold 13px Georgia, serif;
    cursor: pointer;
  }

  .account-order-reorder-button:hover {
    background: var(--shop-ink);
  }

  @media (max-width: 900px) {
    .shop-layout {
      display: block;
      width: 100%;
      padding: 16px;
    }

    .shop-main-content {
      gap: 14px;
    }

    .catalogue-intro {
      align-items: start;
      flex-direction: column;
      gap: 8px;
    }

    .catalogue-intro > p {
      max-width: none;
      text-align: left;
    }

    .department-tabs {
      margin: 0 -2px;
    }
  }

  @media (max-width: 520px) {
    .department-tab {
      min-height: 40px;
      padding: 0 13px;
      font-size: 13px;
    }

    .order-document-link span {
      display: none;
    }

    .account-tab {
      flex: 0 0 auto;
      padding: 10px 12px;
      font-size: 12px;
    }
  }

  /* Espaces personnels : les deux accès du bandeau ouvrent maintenant des vues
     dédiées. Légende toujours visible (pas juste une icône) : "Se connecter"
     quand personne n'est identifié, "Mon compte" / "Mon panier" sinon. */
  .shop-header-actions > button {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 46px;
    min-height: 46px;
    padding: 0 18px;
    border-radius: 999px;
  }

  .shop-header-actions > button > i {
    margin: 0;
    font-size: 16px;
  }

  .header-action-label {
    font-size: 14px;
    font-weight: bold;
    white-space: nowrap;
  }

  #cart-count {
    position: absolute;
    top: -4px;
    right: -5px;
    display: grid;
    place-items: center;
    min-width: 19px;
    height: 19px;
    padding: 0 4px;
    box-sizing: border-box;
    color: var(--shop-white);
    background: #7a1020;
    border: 2px solid var(--shop-white);
    border-radius: 999px;
    font: 700 11px/1 Arial, sans-serif;
  }

  .shop-body.cart-open .shop-layout,
  .shop-body.cart-open .shop-footer {
    margin-right: 0;
  }

  /* #account-panel utilise directement .shop-full-window (regle suivante) :
     plus de largeur/hauteur/padding recalcules en double ici. Meme padding
     que .cart-page-body, pour un rythme visuel identique entre les deux
     pages. */
  .account-panel-body {
    padding: clamp(18px, 3vw, 32px);
  }

  /* Connexion rapide : mise en avant sans etre agressive — c'est un
     raccourci, le formulaire de lien magique juste en dessous reste le
     chemin nominal. */
  .connexion-rapide-carte {
    margin-bottom: 18px;
    padding: 16px;
    background: var(--shop-sand);
    border: 1px solid var(--shop-gold);
    border-radius: 10px;
  }

  .connexion-rapide-titre {
    margin: 0 0 6px;
    color: var(--shop-blue);
    font-size: 13px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .connexion-rapide-email {
    margin: 0 0 12px;
    color: var(--shop-blue);
    font-size: 16px;
    font-weight: bold;
    word-break: break-all;
  }

  .connexion-rapide-bouton {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    min-height: 44px;
    color: var(--shop-white);
    background: var(--shop-blue);
    border: 1px solid var(--shop-blue);
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
  }

  .connexion-rapide-bouton:hover {
    background: var(--shop-ink);
    border-color: var(--shop-ink);
  }

  .connexion-rapide-alt {
    margin: 10px 0 0;
    color: var(--shop-muted);
    font-size: 12px;
    text-align: center;
  }

  /* --- Pages de retour HelloAsso (succes / erreur / annulation) --- */
  .paiement-page {
    grid-column: 1 / -1;
    display: flex;
    justify-content: center;
    padding: clamp(20px, 5vw, 60px) 0;
  }

  .paiement-carte {
    width: min(620px, 100%);
    padding: clamp(24px, 4vw, 40px);
    text-align: center;
    background: var(--shop-white);
    border: 1px solid var(--shop-line);
    border-radius: 14px;
  }

  .paiement-carte h2 {
    margin: 12px 0 10px;
    color: var(--shop-blue);
    font-size: clamp(22px, 3vw, 28px);
  }

  .paiement-carte p {
    margin: 0 auto;
    max-width: 46ch;
    color: var(--shop-ink);
    line-height: 1.5;
  }

  .paiement-icone {
    font-size: 52px;
    line-height: 1;
  }

  .paiement-icone.est-succes { color: #2e7d32; }
  .paiement-icone.est-erreur { color: #7a1020; }
  .paiement-icone.est-attente { color: var(--shop-gold); }
  .paiement-icone.est-question { color: var(--shop-blue); }

  .paiement-details {
    display: grid;
    grid-template-columns: auto auto;
    justify-content: center;
    gap: 4px 14px;
    margin: 20px 0 0;
    padding: 14px;
    background: #f7f8ff;
    border-radius: 8px;
    font-size: 14px;
  }

  .paiement-details dt {
    color: var(--shop-muted);
    text-align: right;
  }

  .paiement-details dd {
    margin: 0;
    color: var(--shop-blue);
    font-weight: bold;
    text-align: left;
  }

  .paiement-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 24px;
  }

  .paiement-bouton-principal,
  .paiement-bouton-danger,
  .paiement-bouton-test {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 46px;
    padding: 0 22px;
    border-radius: 8px;
    font: bold 14px Georgia, serif;
    text-decoration: none;
    cursor: pointer;
  }

  .paiement-bouton-principal {
    color: var(--shop-white);
    background: var(--shop-blue);
    border: 1px solid var(--shop-blue);
  }

  .paiement-bouton-principal:hover {
    color: var(--shop-white);
    background: var(--shop-ink);
  }

  /* L'annulation est destructrice : elle ne doit jamais etre le bouton le
     plus attirant de la page. */
  .paiement-bouton-danger {
    color: #7a1020;
    background: var(--shop-white);
    border: 1px solid #7a1020;
  }

  .paiement-bouton-danger:hover {
    color: var(--shop-white);
    background: #7a1020;
  }

  /* Zone de test : volontairement tres visible et differente du reste, pour
     qu'on ne puisse pas la confondre avec un parcours client normal. */
  .paiement-zone-test {
    margin-top: 26px;
    padding: 14px;
    background: #fff8e1;
    border: 2px dashed var(--shop-gold);
    border-radius: 10px;
  }

  .paiement-zone-test p {
    margin: 0 0 10px;
    color: #8a6d00;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .paiement-bouton-test {
    color: #8a6d00;
    background: var(--shop-white);
    border: 1px solid var(--shop-gold);
  }

  .paiement-alerte-test {
    margin: 0 0 18px !important;
    padding: 10px 14px;
    max-width: none !important;
    color: var(--shop-white);
    background: #7a1020;
    border-radius: 8px;
    font-size: 13px;
    font-weight: bold;
  }

  .paiement-chargement {
    padding: 40px 0;
    color: var(--shop-muted);
  }

  /* Rattachement du compte (groupe / unite / lieu), issu de l'annuaire. */
  .compte-rattachement {
    display: grid;
    gap: 8px;
    padding: 12px 14px;
    background: #f7f8ff;
    border: 1px solid var(--shop-line);
    border-radius: 8px;
  }

  .compte-rattachement-ligne {
    display: grid;
    grid-template-columns: 18px 62px minmax(0, 1fr);
    align-items: baseline;
    gap: 8px;
    font-size: 13px;
  }

  .compte-rattachement-ligne i {
    color: var(--shop-gold);
    font-size: 12px;
  }

  .compte-rattachement-cle {
    color: var(--shop-muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .compte-rattachement-valeur {
    color: var(--shop-blue);
    font-weight: bold;
    word-break: break-word;
  }

  .compte-rattachement-absent {
    margin: 0;
    padding: 10px 12px;
    color: var(--shop-muted);
    background: #f7f8ff;
    border: 1px solid var(--shop-line);
    border-radius: 8px;
    font-size: 12px;
  }

  /* Bouton officiel Google : rendu par la bibliotheque de Google (logo et
     habillage imposes par sa charte, qu'on ne doit pas modifier). On ne
     controle que son placement. */
  #connexion-google {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    margin-bottom: 18px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--shop-line);
  }

  #connexion-google[hidden] {
    display: none;
  }

  #connexion-google-bouton {
    display: flex;
    justify-content: center;
    min-height: 44px;
  }

  /* .shop-full-window-card a overflow:hidden (partagee avec panier/paiement/
     fiche produit) : ca fonctionne pour eux car rien n'y est en position
     sticky. .account-tabs, elle, doit rester collee en haut PENDANT le
     defilement (onglets toujours accessibles sur un long historique) — ça
     exige que le veritable conteneur defilant (.shop-full-window,
     overflow-y:auto) reste son ancetre de reference pour le sticky, sans
     qu'un overflow:hidden intermediaire ne casse ce repere. */
  .account-panel-card {
    overflow: visible;
  }

  .shop-full-window {
    position: fixed;
    inset: 0;
    z-index: 9600;
    display: none;
    /* align-items:flex-start, PAS center. Avec "center", des que la carte est
       plus haute que l'ecran (fiche produit, panier bien rempli, compte),
       le centrage la fait deborder SYMETRIQUEMENT : le haut sort de la zone
       defilable et devient inatteignable — bouton fermer et fil d'Ariane
       coupes sous le bandeau, exactement le defaut signale. Le padding-top
       ci-dessous assure deja le degagement sous l'en-tete ; les cartes plus
       courtes que l'ecran sont centrees via `margin:auto` sur
       .shop-full-window-card, ce qui ne provoque pas ce debordement. */
    align-items: flex-start;
    justify-content: center;
    padding: clamp(16px, 4vw, 48px);
    padding-top: max(clamp(16px, 4vw, 48px), var(--theme-header-height));
    overflow-y: auto;
    box-sizing: border-box;
    /* Fond plein (pas de voile sombre/flouté) : le panier et le paiement doivent
       se lire comme une vraie page, au même titre que "Mon compte"
       (.account-panel) — pas comme une fenêtre modale posée sur le contenu. */
    background: var(--shop-white);
  }

  .shop-full-window.is-open {
    display: flex;
  }

  .shop-full-window-card {
    width: min(1040px, 100%);
    min-height: min-content;
    /* margin:auto (et non 20px auto) : centre verticalement les cartes plus
       COURTES que l'ecran, sans provoquer le debordement inatteignable que
       causait align-items:center sur les cartes plus HAUTES (cf. commentaire
       de .shop-full-window). Les marges verticales minimales sont assurees
       par le padding du conteneur. */
    margin: auto;
    overflow: hidden;
    color: var(--shop-blue);
    background: var(--shop-white);
    /* Ni coins arrondis ni ombre portée : sur un fond blanc identique, une
       carte flottante avec relief se lit toujours comme une fenêtre posée
       par-dessus la page (l'effet "popup" reproché), même sans voile sombre.
       En les retirant, le contenu se fond dans la page — vraie page, pas
       un dialogue. */
  }

  .shop-full-window-header,
  .cart-page-summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
  }

  .shop-full-window-header {
    padding: clamp(18px, 3vw, 30px);
    border-bottom: 1px solid var(--shop-line);
  }

  .shop-full-window-header h2 {
    margin: 3px 0 0;
    color: var(--shop-blue);
    font-size: clamp(25px, 4vw, 34px);
  }

  /* Fil d'Ariane : toujours "Accueil" en premier, chaque segment cliquable
     sauf le dernier (position actuelle). Sert aussi de reperage visuel :
     l'utilisateur sait toujours ou il se trouve dans l'interface. */
  /* Simples liens texte, comme sur un site classique — pas des boutons
     pilule : a la demande explicite de l'utilisateur, qui a juge le rendu
     precedent (boutons imposes, empiles sur une seule ligne compacte)
     illisible. "all:unset" repart d'une base neutre plutot que d'annuler
     un par un les styles heritees de la regle `button` globale. */
  .shop-breadcrumb {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 5px;
    margin: 0 0 6px;
    font-size: 12px;
    line-height: 1.4;
    color: var(--shop-muted);
  }

  .shop-breadcrumb button {
    all: unset;
    color: var(--shop-muted);
    font: 12px Georgia, serif;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    /* Reserve la place du gras (voir :hover) pour que le fil d'Ariane ne
       "saute" pas d'un pixel quand la souris passe dessus. */
    text-shadow: 0 0 currentColor;
  }

  /* Au survol : le lien passe simplement en gras et en bleu marine. Aucun
     fond, aucun cadre — demande explicite de l'utilisateur, qui trouvait la
     pastille sable du survol precedente disgracieuse. Le gras est obtenu par
     text-shadow plutot que font-weight : cela n'change pas la largeur du
     texte, donc aucun decalage des elements voisins. */
  .shop-breadcrumb button:hover {
    color: var(--shop-blue);
    text-shadow: 0.35px 0 currentColor, -0.35px 0 currentColor;
  }

  .shop-breadcrumb i {
    font-size: 8px;
    opacity: 0.6;
  }

  .shop-breadcrumb .is-current {
    color: var(--shop-blue);
    font-weight: bold;
  }

  /* --- Fil d'Ariane loge dans le bandeau d'en-tete --- */
  /* Sous le bloc logo/titre, aligne a gauche : visible en permanence, quelle
     que soit la vue ouverte, et jamais masque par le bandeau (puisqu'il EST
     dedans). Couleurs inversees : le bandeau est bleu marine. */
  .shop-header-brand-zone {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    min-width: 0;
  }

  /* Fleches de navigation + fil d'Ariane sur une meme ligne, facon barre
     d'adresse d'explorateur de fichiers. */
  .shop-nav-ligne {
    display: flex;
    align-items: center;
    gap: 1px;
    margin: 5px 0 -10px;
    min-width: 0;
  }

  /* Boutons icone de la barre de navigation, facon explorateur de fichiers :
     petits, plats, sans bordure. "all: unset" repart d'une base neutre. */
  .shop-nav-ligne .shop-nav-bouton {
    all: unset;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    border-radius: 3px;
    color: rgba(255, 255, 255, 0.75);
    font-size: 11px;
    cursor: pointer;
    box-sizing: border-box;
    transition: background 0.12s ease, color 0.12s ease;
  }

  .shop-nav-ligne .shop-nav-bouton:hover:not(:disabled) {
    color: var(--shop-white);
    background: rgba(255, 255, 255, 0.14);
  }

  /* Grise et non cliquable quand la destination n'existe pas (racine, ou
     aucun historique) : l'etat du bouton renseigne sur ce qui est possible,
     comme dans un explorateur. */
  .shop-nav-ligne .shop-nav-bouton:disabled {
    opacity: 0.32;
    cursor: default;
  }

  .shop-nav-ligne .shop-nav-bouton:focus-visible {
    outline: 2px solid var(--shop-gold);
    outline-offset: 1px;
  }

  /* Separe les commandes d'historique (precedent/suivant/monter/actualiser)
     du raccourci "Accueil" et du fil, comme la barre d'un explorateur. */
  .shop-nav-separateur {
    width: 1px;
    height: 14px;
    margin: 0 2px;
    background: rgba(255, 255, 255, 0.22);
    flex-shrink: 0;
  }

  /* Decale vers le BAS du bandeau sans l'agrandir : la marge est portee par
     .shop-nav-ligne ci-dessus. */
  .shop-breadcrumb-header {
    margin: 0;
    padding-left: 2px;
    min-width: 0;
    color: rgba(255, 255, 255, 0.72);
  }

  .shop-breadcrumb-header[hidden] {
    display: none;
  }

  .shop-breadcrumb-header button {
    color: rgba(255, 255, 255, 0.72);
  }

  .shop-breadcrumb-header button:hover {
    color: var(--shop-white);
  }

  .shop-breadcrumb-header .is-current {
    color: var(--shop-white);
  }

  .shop-breadcrumb-header i {
    color: rgba(255, 255, 255, 0.5);
  }

  /* Fleche de retour : un niveau en arriere, distincte du fil d'Ariane
     (qui permet de sauter directement a un niveau precis). Style defini plus
     bas avec .shop-full-window-header button (bouton minimaliste, sans
     pilule imposee). */

  /* Regroupe fleche de retour + (fil d'Ariane + titre) a gauche de l'en-tete,
     pour que justify-content:space-between de .shop-full-window-header ne
     les eparpille pas : seuls CE bloc et le bouton fermer se partagent
     l'espace, comme avant l'ajout de la fleche. */
  .shop-full-window-title-block {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  /* .product-close inclus ici : c'etait la cause du bouton "fermer" de la
     fiche produit affiche comme un carre arrondi bleu marine, sans centrage
     vertical (il heritait d'une regle pensee pour des boutons texte, avec un
     padding horizontal et aucun display:grid — l'icone flottait donc en
     haut du bouton au lieu d'etre au centre).
     Depuis, a la demande explicite de l'utilisateur : les boutons fermer et
     retour n'ont plus a suivre le style pilule impose au reste de
     l'interface — un simple bouton croix/fleche minimaliste, comme sur une
     interface Windows, suffit. "all:unset" retire TOUT ce qu'ils auraient
     pu heriter (la regle `button` globale de CSS_Common.html notamment),
     pour repartir d'une base neutre plutot que de superposer des
     annulations au cas par cas. .cart-page-remove garde son propre cercle
     sable/or plus bas : lui reste un bouton d'action normal, pas un
     controle de navigation. */
  .shop-full-window-header button,
  .shop-back-arrow {
    all: unset;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    color: var(--shop-muted);
    cursor: pointer;
    border-radius: 6px;
    flex-shrink: 0;
    box-sizing: border-box;
    transition: background 0.12s ease, color 0.12s ease;
  }

  .shop-full-window-header button:hover,
  .shop-back-arrow:hover {
    color: var(--shop-blue);
    background: var(--shop-sand);
  }

  .cart-page-remove {
    display: inline-grid;
    place-items: center;
    width: 42px;
    height: 42px;
    padding: 0;
    color: var(--shop-blue);
    background: var(--shop-sand);
    border: 1px solid var(--shop-gold);
    border-radius: 50%;
    cursor: pointer;
  }

  .cart-page-body {
    padding: clamp(18px, 3vw, 32px);
  }

  .cart-page-lines {
    display: grid;
    gap: 12px;
  }

  .cart-page-line {
    display: grid;
    grid-template-columns: 82px minmax(0, 1fr) 105px auto auto;
    gap: 16px;
    align-items: center;
    padding: 14px;
    border: 1px solid var(--shop-line);
    border-radius: 12px;
  }

  .cart-page-line > img {
    width: 82px;
    height: 82px;
    object-fit: cover;
    border-radius: 9px;
    background: var(--shop-sand);
  }

  .cart-page-line-info {
    display: grid;
    gap: 4px;
  }

  .cart-page-line-info span,
  .cart-page-line-info small {
    color: var(--shop-muted);
  }

  .cart-page-quantity {
    display: grid;
    gap: 4px;
    color: var(--shop-muted);
    font-size: 12px;
  }

  .cart-page-quantity input {
    width: 78px;
    min-height: 38px;
    padding: 6px;
    color: var(--shop-blue);
    border: 1px solid var(--shop-line);
    border-radius: 7px;
  }

  .cart-page-line-total {
    white-space: nowrap;
    font-size: 17px;
  }

  .cart-page-summary {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--shop-line);
  }

  .cart-page-summary > div {
    display: grid;
    gap: 4px;
  }

  .cart-page-summary span {
    color: var(--shop-muted);
    font-size: 13px;
  }

  .cart-page-summary strong {
    font-size: 25px;
  }

  .cart-page-summary > button,
  .cart-page-empty button {
    min-height: 45px;
    padding: 0 18px;
    color: var(--shop-white);
    background: var(--shop-blue);
    border: 1px solid var(--shop-blue);
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
  }

  .cart-page-empty {
    display: grid;
    justify-items: center;
    gap: 12px;
    padding: clamp(36px, 8vw, 82px) 20px;
    color: var(--shop-muted);
    text-align: center;
  }

  .cart-page-empty > i {
    color: var(--shop-gold);
    font-size: 44px;
  }

  .cart-preview-header,
  .cart-preview-total {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .cart-preview-header {
    padding-bottom: 14px;
    border-bottom: 1px solid var(--shop-line);
  }

  .cart-preview-header h2 {
    margin: 2px 0 0;
    font-size: 21px;
  }

  .cart-preview-header button {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    padding: 0;
    color: var(--shop-blue);
    background: var(--shop-sand);
    border: 1px solid var(--shop-gold);
    border-radius: 50%;
    cursor: pointer;
  }

  .cart-preview-lines {
    display: grid;
    gap: 10px;
    margin: 14px 0;
  }

  .cart-preview-line {
    display: grid;
    grid-template-columns: 52px minmax(0, 1fr);
    gap: 10px;
    align-items: center;
  }

  .cart-preview-line img {
    width: 52px;
    height: 52px;
    object-fit: cover;
    border-radius: 7px;
    background: var(--shop-sand);
  }

  .cart-preview-line div {
    display: grid;
    gap: 2px;
  }

  .cart-preview-line span,
  .cart-preview-line small,
  .cart-preview-hint,
  .cart-preview-more,
  .cart-preview-empty {
    color: var(--shop-muted);
    font-size: 12px;
  }

  .cart-preview-total {
    padding: 12px 0;
    border-top: 1px solid var(--shop-line);
    border-bottom: 1px solid var(--shop-line);
  }

  .cart-preview-hint {
    margin: 12px 0 0;
    text-align: center;
  }

  @media (max-width: 720px) {
    .shop-header-actions > button {
      height: 42px;
      min-height: 42px;
      padding: 0 12px;
    }

    .account-panel-body {
      padding: 16px;
    }

    .shop-full-window {
      padding: 0;
    }

    .shop-full-window-card {
      width: 100%;
      min-height: 100%;

      border-radius: 0;
    }

    .cart-page-line {
      grid-template-columns: 62px minmax(0, 1fr) auto;

    }

      width: 62px;
      height: 62px;
    }

    .cart-page-quantity {
      grid-column: 2;
      grid-row: 2;
    }

    .cart-page-line-total {
      grid-column: 3;
      grid-row: 2;
      align-self: end;
    }

    .cart-page-remove {
      grid-column: 3;
      grid-row: 1;
      width: 34px;
      height: 34px;
    }

    .cart-page-summary {
      align-items: stretch;
      flex-direction: column;
    }
  }

  /* ==========================================================================
     TELEPHONE — place en dernier pour primer sur les regles de base
     declarees plus bas que les anciens blocs mobiles (grille catalogue a
     210px mini, fiche produit en 2 colonnes, boutons pilule du bandeau).
     Invisibles tant que le telephone simulait un ecran de 980px (doGet
     n'envoyait pas de balise viewport) ; ils coupaient la fiche produit en
     deux une fois la vraie largeur utilisee.
     ========================================================================== */
  @media (max-width: 820px) {
    /* Fiche produit : image au-dessus, informations en dessous. */
    .shop-full-window-card.product-dialog {
      grid-template-columns: minmax(0, 1fr);
    }

    /* Bandeau : Mon compte / Mon panier en icones rondes a droite de la
       marque, sur la meme rangee (plus de rangee entiere pour eux). */
    .shop-header-actions {
      display: flex;
      width: auto;
      gap: 8px;
    }

    .shop-header-actions > button,
    #account-open-button,
    #cart-open-button {
      width: 44px;
      min-width: 44px;
      height: 44px;
      min-height: 44px;
      padding: 0;
    }

    /* La zone marque + navigation se retrecit au lieu de pousser les
       boutons compte/panier sur une rangee a part quand le fil est long. */
    .shop-header-brand-zone {
      flex: 1 1 0;
      min-width: 0;
    }

    .shop-nav-ligne {
      margin: 4px 0 -4px;
      gap: 2px;
    }

    .shop-nav-ligne .shop-nav-bouton {
      width: 32px;
      height: 32px;
      font-size: 14px;
      border-radius: 6px;
    }

    /* Fil d'Ariane : niveau courant seul, sur une ligne (maison et fleche
       "monter" couvrent les niveaux au-dessus). */
    .shop-breadcrumb-header:not([hidden]) {
      flex-wrap: nowrap;
      overflow: hidden;
      margin-left: 4px;
    }

    .shop-breadcrumb-header button,
    .shop-breadcrumb-header i {
      display: none;
    }

    .shop-breadcrumb-header .is-current {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }
  }

  @media (max-width: 520px) {
    #articles-container.product-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .shop-header h1 {
      font-size: 19px;
    }
  }

  /* ---- Cartes produit : correctifs d'affichage (telephone surtout) ----
     Grille alignee en haut (avant : centree -> cartes en quinconce quand
     les hauteurs different), cartes d'egale hauteur, prix cale en bas, et
     hierarchie de texte retablie (une regle generique sur les <p> donnait
     18 px au rayon et au prix, plus que le nom du produit). */
  #articles-container.product-grid {
    align-items: stretch;
  }

  .article.product-card {
    display: flex;
    flex-direction: column;
  }

  .article.product-card .product-card-content {
    display: flex;
    flex: 1;
    flex-direction: column;
  }

  .article.product-card .product-card-meta {
    font-size: 12px;
    line-height: 1.3;
  }

  .article.product-card .product-card-price {
    margin-top: auto;
    font-size: 16px;
  }

  .article.product-card img.is-broken,
  img.is-broken {
    visibility: hidden;
  }

  @media (max-width: 520px) {
    #articles-container.product-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .article.product-card .product-card-content {
      gap: 4px;
      padding: 10px;
    }

    .article.product-card h2 {
      font-size: 14.5px;
      font-weight: bold;
    }

    .article.product-card .product-card-meta {
      font-size: 11px;
    }

    .article.product-card .product-card-price {
      font-size: 15px;
    }

  }
  /* Paiement : articles devenus indisponibles depuis le remplissage du panier. */
  .checkout-ruptures ul {
    margin: 0;
    padding: 10px 14px 10px 30px;
    color: var(--shop-blue);
    background: var(--shop-sand);
    border-radius: 8px;
    text-align: left;
  }

  .checkout-ruptures li + li {
    margin-top: 4px;
  }
  /* Etiquette ("Nouveaute", "Indispensable"...) : MEME rendu que dans la
     console vendeur (CSS_vendeur.html, .seller-product-card-image
     .product-card-badge) — fanion orange epingle dans le coin, etoile. */
  .product-card-image .product-card-badge,

    font-family: Arial, Helvetica, sans-serif;

  .product-card-image .product-card-badge::before,

  /* Reglage administrateur "taille de la barre de navigation" (ordinateur). */
  @media (min-width: 769px) {
    .shop-nav-ligne { zoom: var(--zoom-barre-nav, 1); }
