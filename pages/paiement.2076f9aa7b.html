</style>

  <script>
    window.PAIEMENT_BOOTSTRAP = __BOOTSTRAP_JSON__;
  </script>
</head>
<body class="shop-body">
  <header class="shop-header">
    <div class="shop-header-brand-zone">
      <div class="brand-block">
        <img class="app-logo" src="https://drive.google.com/thumbnail?id=1FR8lKfSS-20CdkOoz4Sof3axGMiInerq&sz=w120-h120" alt="Logo boutique GDB" onerror="this.style.display='none'">
        <div>
          <p class="shop-kicker">Boutique GDB</p>
          <h1>Boutique officielle</h1>
        </div>
      </div>
    </div>
  </header>

  <div class="shop-layout">
    <div class="paiement-page">
      <div id="paiement-carte" class="paiement-carte">
        <div class="paiement-chargement"><i class="fa-solid fa-spinner fa-spin"></i> Vérification en cours…</div>
      </div>
    </div>
  </div>

  <script>
  (function () {
    var infos = window.PAIEMENT_BOOTSTRAP || {};
    var carte = document.getElementById("paiement-carte");

    function echapper(texte) {
      return String(texte === null || texte === undefined ? "" : texte)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function urlBoutique() {
      return infos.urlBoutique || "";
    }

    // Deux avertissements distincts, du plus important au moins important :
    //  - commandeTest : CETTE commande est fictive (elle porte le prefixe
    //    TEST-), quoi qu'il arrive ensuite. C'est ce qu'il faut dire en
    //    premier, et cela reste vrai meme si le mode test a ete eteint entre
    //    temps ;
    //  - modeTest : le mode est actif en ce moment, donc de nouvelles
    //    commandes de test peuvent encore etre creees.
    function bandeauModeTest() {
      if (infos.commandeTest) {
        return '<p class="paiement-alerte-test"><i class="fa-solid fa-flask"></i> '
          + 'COMMANDE DE TEST — aucun paiement ne sera encaissé, aucun stock n\'est décompté '
          + 'et le vendeur ne prépare rien.</p>';
      }
      if (!infos.modeTest) return "";
      return '<p class="paiement-alerte-test"><i class="fa-solid fa-triangle-exclamation"></i> '
        + 'MODE TEST ACTIF — les commandes peuvent être validées sans paiement réel.</p>';
    }

    // Adapte les phrases parlant de stock : une commande de test n'en a jamais
    // reserve, promettre le contraire serait faux.
    function phraseStockReserve() {
      return infos.commandeTest
        ? "Aucun article n'a été réservé : cette commande est un test."
        : "Les articles vous sont réservés quelques heures.";
    }

    function blocCommande() {
      if (!infos.commande) return "";
      return '<dl class="paiement-details">'
        + '<dt>Référence</dt><dd>' + echapper(infos.commande.reference) + '</dd>'
        + '<dt>Montant</dt><dd>' + echapper(infos.commande.total) + ' €</dd>'
        + '</dl>';
    }

    function rendreSucces() {
      var confirme = infos.paiementConfirme;
      carte.innerHTML = [
        bandeauModeTest(),
        '<div class="paiement-icone ' + (confirme ? 'est-succes' : 'est-attente') + '">',
        '<i class="fa-solid ' + (confirme ? 'fa-circle-check' : 'fa-hourglass-half') + '"></i></div>',
        '<h2>' + (confirme ? 'Merci, votre commande est confirmée' : 'Paiement en cours de vérification') + '</h2>',
        '<p>' + (confirme
          ? 'Votre règlement a bien été reçu. Un e-mail de confirmation vous a été envoyé.'
          : "HelloAsso nous a renvoyés ici, mais la confirmation du paiement ne nous est pas encore parvenue. "
            + "C'est généralement une question de quelques instants : votre commande sera validée automatiquement dès réception. "
            + "Inutile de payer une seconde fois.") + '</p>',
        blocCommande(),
        '<div class="paiement-actions">',
        '<a class="paiement-bouton-principal" href="' + echapper(urlBoutique()) + '">Retour à la boutique</a>',
        '</div>'
      ].join("");
    }

    function rendreErreur() {
      carte.innerHTML = [
        bandeauModeTest(),
        '<div class="paiement-icone est-erreur"><i class="fa-solid fa-circle-xmark"></i></div>',
        '<h2>Le paiement n\'a pas abouti</h2>',
        '<p>Votre commande n\'a pas été validée et <strong>aucun montant n\'a été prélevé</strong>. '
          + phraseStockReserve() + ' Vous pouvez réessayer.</p>',
        blocCommande(),
        '<div class="paiement-actions">',
        '<a class="paiement-bouton-principal" href="' + echapper(urlBoutique()) + '">Revenir à la boutique</a>',
        '<button type="button" class="paiement-bouton-danger" onclick="demanderAnnulation()">Annuler ma commande</button>',
        '</div>',
        boutonTest()
      ].join("");
    }

    // backUrl : le client a quitte HelloAsso AVANT de payer. On ne decide pas
    // a sa place — on demande, car "retour" peut aussi bien vouloir dire
    // "je me suis trompe" que "je veux annuler".
    function rendreRetour() {
      carte.innerHTML = [
        bandeauModeTest(),
        '<div class="paiement-icone est-question"><i class="fa-solid fa-circle-question"></i></div>',
        '<h2>Voulez-vous vraiment annuler&nbsp;?</h2>',
        '<p>Vous avez quitté la page de paiement avant de régler. Votre commande est '
          + '<strong>en attente</strong>. ' + phraseStockReserve() + '</p>',
        blocCommande(),
        '<div class="paiement-actions">',
        '<a class="paiement-bouton-principal" href="' + echapper(urlBoutique()) + '">Non, revenir à ma commande</a>',
        '<button type="button" class="paiement-bouton-danger" onclick="demanderAnnulation()">Oui, annuler la commande</button>',
        '</div>',
        boutonTest()
      ].join("");
    }

    // Raccourci de test. Deux conditions, les memes que cote serveur : le mode
    // test doit etre actif ET la commande doit avoir ete creee en mode test.
    // Le controle qui fait foi est celui du serveur — celui-ci ne fait
    // qu'eviter d'afficher un bouton qui serait de toute facon refuse.
    function boutonTest() {
      if (!infos.modeTest || !infos.commandeTest || !infos.reference) return "";
      return '<div class="paiement-zone-test">'
        + '<p><i class="fa-solid fa-flask"></i> Outil de test — aucun paiement réel</p>'
        + '<button type="button" class="paiement-bouton-test" onclick="validerSansPayer()">'
        + 'Valider cette commande comme payée</button></div>';
    }

    window.demanderAnnulation = function () {
      var question = infos.commandeTest
        ? "Annuler définitivement cette commande de test ?"
        : "Annuler définitivement cette commande ? Les articles seront remis en stock.";
      if (!confirm(question)) return;
      carte.innerHTML = '<div class="paiement-chargement"><i class="fa-solid fa-spinner fa-spin"></i> Annulation…</div>';
      google.script.run
        .withSuccessHandler(function (r) {
          if (!r || !r.success) {
            carte.innerHTML = '<div class="paiement-icone est-erreur"><i class="fa-solid fa-circle-xmark"></i></div>'
              + '<h2>Annulation impossible</h2><p>' + echapper((r && r.error) || "Erreur inconnue.") + '</p>'
              + '<div class="paiement-actions"><a class="paiement-bouton-principal" href="'
              + echapper(urlBoutique()) + '">Retour à la boutique</a></div>';
            return;
          }
          carte.innerHTML = '<div class="paiement-icone est-succes"><i class="fa-solid fa-circle-check"></i></div>'
            + '<h2>Commande annulée</h2><p>'
            + (infos.commandeTest
                ? "Commande de test annulée. Aucun stock n'était engagé, aucun montant n'a été prélevé."
                : "Les articles ont été remis en stock. Aucun montant n'a été prélevé.")
            + '</p>'
            + '<div class="paiement-actions"><a class="paiement-bouton-principal" href="'
            + echapper(urlBoutique()) + '">Retour à la boutique</a></div>';
        })
        .withFailureHandler(function (e) {
          carte.innerHTML = '<div class="paiement-icone est-erreur"><i class="fa-solid fa-circle-xmark"></i></div>'
            + '<h2>Annulation impossible</h2><p>' + echapper(e && e.message) + '</p>';
        })
        .annulerCommandeDepuisRetour(infos.reference);
    };

    window.validerSansPayer = function () {
      carte.innerHTML = '<div class="paiement-chargement"><i class="fa-solid fa-spinner fa-spin"></i> Validation de test…</div>';
      google.script.run
        .withSuccessHandler(function (r) {
          if (!r || !r.success) {
            carte.innerHTML = '<div class="paiement-icone est-erreur"><i class="fa-solid fa-circle-xmark"></i></div>'
              + '<h2>Validation impossible</h2><p>' + echapper((r && r.error) || "Erreur inconnue.") + '</p>';
            return;
          }
          carte.innerHTML = '<div class="paiement-icone est-succes"><i class="fa-solid fa-circle-check"></i></div>'
            + '<h2>Commande validée (test)</h2>'
            + '<p>La commande a été marquée comme payée <strong>sans paiement réel</strong>. '
            + 'Elle apparaît maintenant côté vendeur, signalée comme commande de test.</p>'
            + '<p>Ce qui n\'a <strong>pas</strong> eu lieu : aucun stock décompté, '
            + 'aucune notification au vendeur, aucun événement d\'agenda. '
            + 'Seul l\'e-mail de confirmation au client a été envoyé, préfixé « [TEST] ».</p>'
            + '<div class="paiement-actions"><a class="paiement-bouton-principal" href="'
            + echapper(urlBoutique()) + '">Retour à la boutique</a></div>';
        })
        .withFailureHandler(function (e) {
          carte.innerHTML = '<div class="paiement-icone est-erreur"><i class="fa-solid fa-circle-xmark"></i></div>'
            + '<h2>Validation impossible</h2><p>' + echapper(e && e.message) + '</p>';
        })
        .validerCommandeSansPaiementTest(infos.reference);
    };

    if (infos.statut === "succes") rendreSucces();
    else if (infos.statut === "erreur") rendreErreur();
    else rendreRetour();
  })();
  </script>
</body>
</html>
